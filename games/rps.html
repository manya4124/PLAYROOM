<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors | PLAYROOM</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css">


    <!-- RPS CSS -->

    <link
        rel="stylesheet"
        href="../css/rps.css">

</head>


<body>


    <!-- ========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="container">

            <a
                class="navbar-brand"
                href="../index.html">

                🎮 PLAYROOM

            </a>


            <a
                href="../index.html"
                class="back-btn">

                ← Back to Games

            </a>

        </div>

    </nav>



    <!-- ========================================
         HEADER
    ========================================= -->

    <section class="rps-header">

        <div class="container text-center">

            <p class="hero-small">

                GAME 04

            </p>


            <h1>

                ✊ ROCK PAPER SCISSORS ✋

            </h1>


            <p>

                Can you beat the computer?

            </p>

        </div>

    </section>



    <!-- ========================================
         SCOREBOARD
    ========================================= -->

    <main class="container">


        <div class="rps-score">


            <div>

                <span>
                    YOU
                </span>

                <strong id="player-score">
                    0
                </strong>

            </div>


            <div>

                <span>
                    DRAWS
                </span>

                <strong id="draw-score">
                    0
                </strong>

            </div>


            <div>

                <span>
                    COMPUTER
                </span>

                <strong id="computer-score">
                    0
                </strong>

            </div>


        </div>



        <!-- ====================================
             CHOICES
        ===================================== -->

        <section class="choice-section">


            <h2>

                Choose your weapon 👀

            </h2>


            <div class="choices">


                <button
                    class="choice-btn"
                    data-choice="rock">

                    <span class="choice-emoji">
                        ✊
                    </span>

                    <span>
                        Rock
                    </span>

                </button>


                <button
                    class="choice-btn"
                    data-choice="paper">

                    <span class="choice-emoji">
                        ✋
                    </span>

                    <span>
                        Paper
                    </span>

                </button>


                <button
                    class="choice-btn"
                    data-choice="scissors">

                    <span class="choice-emoji">
                        ✌️
                    </span>

                    <span>
                        Scissors
                    </span>

                </button>


            </div>

        </section>



        <!-- ====================================
             BATTLE
        ===================================== -->

        <section class="battle-section">


            <div class="battle-player">


                <span>
                    YOU
                </span>


                <div
                    id="player-choice"
                    class="battle-choice">

                    ❔

                </div>


            </div>



            <div class="vs">

                VS

            </div>



            <div class="battle-player">


                <span>
                    COMPUTER
                </span>


                <div
                    id="computer-choice"
                    class="battle-choice">

                    ❔

                </div>


            </div>


        </section>



        <!-- ====================================
             RESULT
        ===================================== -->

        <div
            id="rps-result"
            class="rps-result">

            Choose an option to start!

        </div>



        <!-- ====================================
             HISTORY
        ===================================== -->

        <section class="history-section">


            <h2>

                📜 Round History

            </h2>


            <div
                id="history-list"
                class="history-list">

                <p class="empty-history">

                    No rounds played yet.

                </p>

            </div>


        </section>



        <!-- ====================================
             BEST RECORD
        ===================================== -->

        <div
            id="best-record"
            class="best-record">

            🏆 Best Win Streak:
            <strong>0</strong>

        </div>



        <!-- ====================================
             RESET
        ===================================== -->

        <div class="text-center mt-4 mb-5">

            <button
                id="rps-reset"
                class="btn game-btn">

                🔄 Reset Game

            </button>

        </div>


    </main>



    <!-- ========================================
         jQuery
    ========================================= -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- RPS JS -->

    <script src="../js/rps.js"></script>


</body>

</html>
