<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reaction Rush | PLAYROOM</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css">


    <!-- Reaction CSS -->

    <link
        rel="stylesheet"
        href="../css/reaction.css">

</head>


<body>


    <!-- ========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="container">

            <a
                class="navbar-brand"
                href="../index.html">

                🎮 PLAYROOM

            </a>


            <a
                href="../index.html"
                class="back-btn">

                ← Back to Games

            </a>

        </div>

    </nav>



    <!-- ========================================
         HEADER
    ========================================= -->

    <section class="reaction-header">

        <div class="container text-center">

            <p class="hero-small">

                GAME 03

            </p>


            <h1>

                🎯 REACTION RUSH

            </h1>


            <p>

                How fast can you react?

            </p>

        </div>

    </section>



    <!-- ========================================
         GAME AREA
    ========================================= -->

    <main class="container">


        <!-- GAME STATS -->

        <div class="reaction-stats">


            <div>

                <span>
                    ROUND
                </span>

                <strong id="round">
                    0 / 5
                </strong>

            </div>


            <div>

                <span>
                    BEST
                </span>

                <strong id="best-reaction">
                    -
                </strong>

            </div>


            <div>

                <span>
                    AVERAGE
                </span>

                <strong id="average-reaction">
                    -
                </strong>

            </div>


        </div>



        <!-- REACTION AREA -->

        <div
            id="reaction-box"
            class="reaction-box">


            <div
                id="reaction-content"
                class="reaction-content">


                <div class="reaction-icon">

                    🎯

                </div>


                <h2 id="reaction-title">

                    READY?

                </h2>


                <p id="reaction-message">

                    Click the button to begin!

                </p>


                <button
                    id="start-reaction"
                    class="btn game-btn">

                    START GAME

                </button>


            </div>

        </div>



        <!-- LAST RESULT -->

        <div
            id="last-result"
            class="last-result">

        </div>



        <!-- RESTART -->

        <div class="text-center mt-4 mb-5">

            <button
                id="reaction-restart"
                class="btn game-btn">

                🔄 Restart

            </button>

        </div>


    </main>



    <!-- ========================================
         RESULTS OVERLAY
    ========================================= -->

    <div
        id="reaction-overlay"
        class="reaction-overlay">


        <div class="reaction-modal">


            <div class="result-emoji">

                🏆

            </div>


            <h2>

                RESULTS!

            </h2>


            <p>

                Here's how fast you were:

            </p>


            <!-- RESULTS LIST -->

            <div
                id="results-list"
                class="results-list">

            </div>


            <!-- FINAL STATS -->

            <div class="final-reaction-stats">


                <div>

                    <span>
                        Average
                    </span>

                    <strong id="final-average">
                        0
                    </strong>

                </div>


                <div>

                    <span>
                        Best
                    </span>

                    <strong id="final-best">
                        0
                    </strong>

                </div>


            </div>


            <p
                id="reaction-new-best"
                class="reaction-new-best">

                🏆 NEW BEST!

            </p>


            <button
                id="reaction-play-again"
                class="btn game-btn">

                🎯 Play Again

            </button>


            <a
                href="../index.html"
                class="home-link">

                ← Back to Games

            </a>


        </div>

    </div>



    <!-- ========================================
         jQuery
    ========================================= -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- Reaction JS -->

    <script src="../js/reaction.js"></script>


</body>

</html>
