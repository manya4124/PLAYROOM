<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Match | PLAYROOM</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Memory CSS -->
    <link rel="stylesheet" href="../css/memory.css">

</head>


<body>


    <!-- ========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="container">

            <a class="navbar-brand" href="../index.html">
                🎮 PLAYROOM
            </a>

            <a href="../index.html" class="back-btn">
                ← Back to Games
            </a>

        </div>

    </nav>


    <!-- ========================================
         GAME HEADER
    ========================================= -->

    <section class="memory-header">

        <div class="container text-center">

            <p class="hero-small">
                GAME 01
            </p>

            <h1>
                🃏 MEMORY MATCH
            </h1>

            <p>
                Find all the matching pairs!
            </p>

        </div>

    </section>


    <!-- ========================================
         GAME AREA
    ========================================= -->

    <main class="container">


        <!-- GAME INFORMATION -->

        <div class="game-info">


            <div>

                <strong>
                    Moves
                </strong>

                <span id="moves">
                    0
                </span>

            </div>


            <div>

                <strong>
                    Pairs
                </strong>

                <span id="pairs">
                    0 / 6
                </span>

            </div>


            <div>

                <strong>
                    Time
                </strong>

                <span>
                    <span id="timer">0</span>s
                </span>

            </div>


            <div>

                <strong>
                    Best
                </strong>

                <span id="best-score">
                    -
                </span>

            </div>


        </div>


        <!-- MEMORY BOARD -->

        <div
            id="memory-board"
            class="memory-board">
        </div>


        <!-- RESTART -->

        <div class="text-center mt-4 mb-5">

            <button
                id="restart-btn"
                class="btn game-btn">

                🔄 Restart

            </button>

        </div>


    </main>


    <!-- ========================================
         WIN MODAL
    ========================================= -->

    <div
        class="win-overlay"
        id="win-overlay"
    >

        <div class="win-modal">


            <div class="win-emoji">
                🎉
            </div>


            <h2>
                YOU WON!
            </h2>


            <p>
                You found all the pairs!
            </p>


            <div class="win-stats">


                <div>

                    <span>
                        Moves
                    </span>

                    <strong id="final-moves">
                        0
                    </strong>

                </div>


                <div>

                    <span>
                        Time
                    </span>

                    <strong>
                        <span id="final-time">
                            0
                        </span>s
                    </strong>

                </div>


            </div>


            <p
                id="new-best"
                class="new-best">
                🏆 NEW BEST SCORE!
            </p>


            <button
                id="play-again"
                class="btn game-btn">

                🎮 Play Again

            </button>


            <a
                href="../index.html"
                class="home-link">

                ← Back to Games

            </a>


        </div>

    </div>


    <!-- ========================================
         jQuery
    ========================================= -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- Memory JavaScript -->

    <script src="../js/memory.js"></script>


</body>

</html>
