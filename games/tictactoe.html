<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe | PLAYROOM</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css">


    <!-- Tic Tac Toe CSS -->

    <link
        rel="stylesheet"
        href="../css/tictactoe.css">

</head>


<body>


    <!-- ========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="container">

            <a
                class="navbar-brand"
                href="../index.html">

                🎮 PLAYROOM

            </a>


            <a
                href="../index.html"
                class="back-btn">

                ← Back to Games

            </a>

        </div>

    </nav>



    <!-- ========================================
         GAME HEADER
    ========================================= -->

    <section class="ttt-header">

        <div class="container text-center">

            <p class="hero-small">

                GAME 02

            </p>


            <h1>

                ❌ TIC TAC TOE ⭕

            </h1>


            <p>

                Beat the computer!

            </p>

        </div>

    </section>



    <!-- ========================================
         GAME AREA
    ========================================= -->

    <main class="container">


        <!-- SCORE -->

        <div class="ttt-score">


            <div>

                <span>
                    YOU
                </span>

                <strong id="player-score">
                    0
                </strong>

            </div>


            <div>

                <span>
                    DRAWS
                </span>

                <strong id="draw-score">
                    0
                </strong>

            </div>


            <div>

                <span>
                    COMPUTER
                </span>

                <strong id="computer-score">
                    0
                </strong>

            </div>


        </div>



        <!-- TURN -->

        <div class="turn-display">

            <span id="turn-text">
                Your turn! ❌
            </span>

        </div>



        <!-- BOARD -->

        <div
            id="tic-tac-toe-board"
            class="tic-tac-toe-board">


            <button
                class="ttt-cell"
                data-index="0">
            </button>


            <button
                class="ttt-cell"
                data-index="1">
            </button>


            <button
                class="ttt-cell"
                data-index="2">
            </button>


            <button
                class="ttt-cell"
                data-index="3">
            </button>


            <button
                class="ttt-cell"
                data-index="4">
            </button>


            <button
                class="ttt-cell"
                data-index="5">
            </button>


            <button
                class="ttt-cell"
                data-index="6">
            </button>


            <button
                class="ttt-cell"
                data-index="7">
            </button>


            <button
                class="ttt-cell"
                data-index="8">
            </button>


        </div>



        <!-- RESTART -->

        <div class="text-center mt-4 mb-5">

            <button
                id="ttt-restart"
                class="btn game-btn">

                🔄 New Game

            </button>

        </div>


    </main>



    <!-- ========================================
         RESULT OVERLAY
    ========================================= -->

    <div
        class="ttt-overlay"
        id="ttt-overlay">


        <div class="ttt-modal">


            <div
                id="result-emoji"
                class="result-emoji">

                🎉

            </div>


            <h2 id="result-title">

                YOU WON!

            </h2>


            <p id="result-message">

                Nice move!

            </p>


            <button
                id="ttt-play-again"
                class="btn game-btn">

                🎮 Play Again

            </button>


            <a
                href="../index.html"
                class="home-link">

                ← Back to Games

            </a>


        </div>

    </div>



    <!-- ========================================
         jQuery
    ========================================= -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>



    <!-- Tic Tac Toe JS -->

    <script src="../js/tictactoe.js"></script>


</body>

</html>
